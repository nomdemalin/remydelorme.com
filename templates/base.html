<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="color-scheme" content="light">
  <link rel="preload" href="{{ get_url(path='fonts/archivo.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/roboto-mono.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='css/site.css', cachebust=true) }}">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="Notes" href="{{ get_url(path='notes/atom.xml') }}">
  <link rel="canonical" href="{% block canonical %}{{ config.base_url }}/{% endblock %}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">
    <div class="sheet">
      <header class="masthead-bar blk">
        <a class="wordmark" href="{{ config.base_url }}/">Rémy Delorme</a>
        <nav aria-label="Main">
          {%- set here = current_path or "/" %}
          <ul class="nav">
            <li><a href="{{ get_url(path='@/notes/_index.md') }}"{% if here is starting_with(pat="/notes/") %} aria-current="page"{% endif %}>A. Notes</a></li>
            <li><a href="{{ get_url(path='@/workshop/_index.md') }}"{% if here is starting_with(pat="/workshop/") %} aria-current="page"{% endif %}>B. Workshop</a></li>
            <li><a href="{{ get_url(path='@/colophon.md') }}"{% if here is starting_with(pat="/colophon/") %} aria-current="page"{% endif %}>C. Colophon</a></li>
          </ul>
        </nav>
      </header>

      <main id="main" tabindex="-1">
        {% block content %}{% endblock %}
      </main>

      <footer class="foot blk">
        <p class="foot__line">No further questions.</p>
        <a href="{{ get_url(path='@/colophon.md') }}">Section C: Colophon</a>
      </footer>
    </div>
  </div>
</body>
</html>
